name: Publication metadata audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit-publications.py'
      - '.github/workflows/publication-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compare publication records
        run: python scripts/audit-publications.py
      - name: Save comparison report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: publication-audit
          path: publication-audit.json
          if-no-files-found: warn
